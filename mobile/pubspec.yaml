// ----------------------------------------------------------------------------
// 1. DATA MODELS
// ----------------------------------------------------------------------------

enum MessageRole { user, assistant }

class Message {
  final String id;
  final MessageRole role;
  final String content;
  final String? provider;
  final DateTime timestamp;

  Message({
    required this.id,
    required this.role,
    required this.content,
    this.provider,
    DateTime? timestamp,
  }) : timestamp = timestamp ?? DateTime.now();

  Map<String, dynamic> toJson() {
    return {
      'role': role == MessageRole.assistant ? 'assistant' : 'user',
      'content': content,
    };
  }
}

// ----------------------------------------------------------------------------
// 2. API SERVICE
// ----------------------------------------------------------------------------

class ApiService {
  static const String baseUrl = 'http://10.0.2.2:3000/api';

  static Future<String> sendMessage({
    required String provider,
    required List<Message> history,
  }) async {
    final url = Uri.parse('$baseUrl/chat');

    final payload = jsonEncode({
      'provider': provider.toLowerCase(),
      'messages': history.map((msg) => msg.toJson()).toList(),
    });

    try {
      final response = await http.post(
        url,
        headers: {'Content-Type': 'application/json'},
        body: payload,
      ).timeout(const Duration(seconds: 45));

      final data = jsonDecode(response.body);

      if (response.statusCode == 200 && data['success'] == true) {
        return data['message'] as String;
      } else {
        throw Exception(data['error'] ?? 'Server returned an error request.');
      }
    } catch (e) {
      throw Exception('Failed to connect to Nova Backend: ${e.toString()}');
    }
  }

  static Future<bool> checkHealth() async {
    try {
      final response = await http
          .get(Uri.parse('$baseUrl/health'))
          .timeout(const Duration(seconds: 5));
      return response.statusCode == 200;
    } catch (_) {
      return false;
    }
  }
}

